<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Automator Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 15px; background: #6d4aff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 10px; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>SimpleLogin Routing Settings</h2>
  
  <label for="apiKey">SimpleLogin API Key:</label>
  <input type="password" id="apiKey" placeholder="Enter sl_ key...">

  <label for="senderAlias">Default From Address:</label>
  <input type="email" id="senderAlias" value="custom@aliasedoman.com">

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
